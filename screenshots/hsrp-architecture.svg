<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="100%" stop-color="#081021" />
    </linearGradient>
    <linearGradient id="amberPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101e3f" />
      <stop offset="100%" stop-color="#081022" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" fill="url(#bgGrad)" />

  <text x="500" y="45" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="900" font-size="22" text-anchor="middle">Cisco HSRP First-Hop Redundancy &amp; Preempt Delay Architecture</text>
  <text x="500" y="70" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">RFC 2281 / RFC 7868 Gateway Failover, Virtual MAC &amp; Reload Blackhole Defense</text>

  <!-- WAN / Core Cloud -->
  <rect x="360" y="100" width="280" height="60" rx="10" fill="url(#nodeGrad)" stroke="#38bdf8" stroke-width="1.5" />
  <text x="500" y="135" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Enterprise Core / WAN (OSPF &amp; BGP)</text>

  <!-- Router A: Active Distribution Switch (Left) -->
  <rect x="60" y="200" width="340" height="230" rx="10" fill="url(#nodeGrad)" stroke="#f59e0b" stroke-width="2" />
  <rect x="75" y="215" width="310" height="26" rx="4" fill="url(#amberPurple)" />
  <text x="230" y="233" fill="#050811" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Dist-A: ACTIVE Gateway (10.100.0.2)</text>

  <text x="75" y="265" fill="#cbd5e1" font-family="monospace" font-size="11">Priority: 110 (Deterministic Primary)</text>
  <text x="75" y="285" fill="#fbbf24" font-family="monospace" font-size="10">• Virtual IP: 10.100.0.1 (VIP)</text>
  <text x="75" y="305" fill="#fbbf24" font-family="monospace" font-size="10">• Virtual MAC: 0000.0c9f.f064 (HSRPv2)</text>
  <text x="75" y="325" fill="#34d399" font-family="monospace" font-size="10">• Preempt Delay Minimum: 180 Seconds</text>
  <text x="75" y="345" fill="#22d3ee" font-family="monospace" font-size="10">• MD5 Key: CampusCore$HSRP2026</text>
  <text x="75" y="365" fill="#c084fc" font-family="monospace" font-size="10">• Track 100 Uplink line-protocol (dec 30)</text>
  <rect x="75" y="385" width="310" height="30" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" />
  <text x="230" y="405" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">✓ Forwarding Active Gateway Traffic</text>

  <!-- Router B: Standby Distribution Switch (Right) -->
  <rect x="600" y="200" width="340" height="230" rx="10" fill="url(#nodeGrad)" stroke="#38bdf8" stroke-width="2" />
  <rect x="615" y="215" width="310" height="26" rx="4" fill="rgba(56, 189, 248, 0.2)" />
  <text x="770" y="233" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Dist-B: STANDBY Gateway (10.100.0.3)</text>

  <text x="615" y="265" fill="#cbd5e1" font-family="monospace" font-size="11">Priority: 100 (Backup Standby)</text>
  <text x="615" y="285" fill="#cbd5e1" font-family="monospace" font-size="10">• Virtual IP: 10.100.0.1 (VIP Shared)</text>
  <text x="615" y="305" fill="#cbd5e1" font-family="monospace" font-size="10">• Listens on UDP Port 2026 (224.0.0.102)</text>
  <text x="615" y="325" fill="#34d399" font-family="monospace" font-size="10">• BFD Fast Detect Enabled (sub-500ms)</text>
  <text x="615" y="345" fill="#22d3ee" font-family="monospace" font-size="10">• Preempt Enabled with 180s Delay</text>
  <text x="615" y="365" fill="#c084fc" font-family="monospace" font-size="10">• Synchronized MD5 Key</text>
  <rect x="615" y="385" width="310" height="30" rx="4" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" />
  <text x="770" y="405" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">✓ Hot Standby - Ready for Instant Failover</text>

  <!-- Inter-Switch Link (Peer-Trunk) -->
  <line x1="400" y1="315" x2="600" y2="315" stroke="#a855f7" stroke-width="3" stroke-dasharray="6" />
  <rect x="440" y="295" width="120" height="40" rx="6" fill="#040917" stroke="#a855f7" />
  <text x="500" y="315" fill="#c084fc" font-family="monospace" font-size="10" text-anchor="middle">802.1Q TRUNK</text>
  <text x="500" y="328" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">HSRPv2 Heartbeat</text>

  <!-- Bottom: Preempt Delay Blackhole Defense Breakdown -->
  <rect x="60" y="460" width="880" height="150" rx="10" fill="url(#nodeGrad)" stroke="#16264d" stroke-width="1.5" />
  <text x="80" y="488" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="13">Why Preempt Delay Minimum (180s) is Mandatory in Zero-Trust Campus LANs</text>

  <rect x="80" y="505" width="410" height="85" rx="6" fill="rgba(239, 68, 68, 0.12)" stroke="#ef4444" />
  <text x="95" y="525" fill="#f87171" font-family="sans-serif" font-weight="bold" font-size="11">WITHOUT Preempt Delay (Instant Blackhole Outage):</text>
  <text x="95" y="545" fill="#cbd5e1" font-family="sans-serif" font-size="10">• Dist-A reboots and assumes ACTIVE role at 0 seconds.</text>
  <text x="95" y="560" fill="#cbd5e1" font-family="sans-serif" font-size="10">• Upstream OSPF/BGP takes 60-90s to populate routing table.</text>
  <text x="95" y="575" fill="#f87171" font-family="monospace" font-size="10">✗ Result: 11.25M packets dropped (90s complete blackhole!)</text>

  <rect x="510" y="505" width="410" height="85" rx="6" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" />
  <text x="525" y="525" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="11">WITH Preempt Delay 180s (Protected High Availability):</text>
  <text x="525" y="545" fill="#cbd5e1" font-family="sans-serif" font-size="10">• Dist-A waits in STANDBY for 180s while uplinks converge.</text>
  <text x="525" y="560" fill="#cbd5e1" font-family="sans-serif" font-size="10">• Dist-B continues forwarding all client traffic uninterrupted.</text>
  <text x="525" y="575" fill="#34d399" font-family="monospace" font-size="10">✓ Result: Zero dropped packets during switch reload.</text>

  <!-- Connectors to Core -->
  <line x1="230" y1="200" x2="430" y2="160" stroke="#f59e0b" stroke-width="2" />
  <line x1="770" y1="200" x2="570" y2="160" stroke="#38bdf8" stroke-width="2" />
</svg>
